[project]
name = "counsel-analytics"
version = "0.1.0"
description = "Aggregate turnaround, volume, and redline pattern analytics for external counsel on private-markets transactions."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "python-dateutil>=2.8",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]
direct-mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
counsel-analytics = "counsel_analytics.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["counsel_analytics*"]
