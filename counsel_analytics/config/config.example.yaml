# Copy to config.yaml and fill in real values. Never commit config.yaml.

# iManage library + matter (workspace) IDs to analyze in this run.
matter_ids:
  - "LIB!12345"

# "redline" (default): external-counsel document review — turnaround,
# redline volume, clause re-argument, plus correspondence/tone.
# "compliance": correspondence-only regulatory matters — no documents,
# tone/escalation trend-spotting only. Point firm_domains at the
# regulator's domain(s) instead of a law firm's in this mode.
domain: redline

# Which MCP client implementation to use: "session" (data handed in by the
# orchestrating Claude session) or "direct" (module runs as its own MCP
# client with org OAuth — Phase 4, standalone/scheduled runs).
mcp_client: session

# Domains treated as "internal" (Ninety One) when classifying author_side.
internal_domains:
  - "ninetyone.com"

# Map external-counsel email domains to a firm display name for rollups.
firm_domains:
  examplefirmllp.com: "Example Firm LLP"

# How many calendar days either side of a version event to search
# correspondence for (ingest.correspond).
correspondence_window_days: 3

# Business-day calendar for turnaround calculations. MVP: weekdays only.
business_calendar: weekdays_only

thresholds:
  # Below this cosine similarity, a re-touched "settled" clause is flagged
  # as re-argued with a different rationale (requires embeddings; ignored
  # by the MVP ping-pong fallback).
  reargument_similarity_threshold: 0.55
  # A clause touched in >= this many rounds is flagged by the no-embeddings
  # ping-pong fallback.
  reargument_ping_pong_rounds: 3

# "none" (MVP default, no external dependency) | "local" (sentence-transformers)
# | "api" (anthropic).
embedding_provider: none

# Maps author identities to a role label or stable hash in every output, so
# metrics can be shown to the firm being measured without exposing named
# individuals.
anonymize_authors: false

output_dir: "./data/output"

# Review packet (the ~5-minute-read artifact, `counsel-analytics packet`).
packet:
  max_highlights: 8
  min_abs_value: 0.0

# Escalation-lexicon path for tone scoring. Unset -> packaged default at
# config/lexicons/escalation_terms.yaml.
tone_lexicon_path: null

# Named-timekeeper invoice-audit flags (see README guardrail carve-out).
# Off by default; only takes effect if raw_data["billing"] has entries for
# the matter. Never affected by anonymize_authors.
billing:
  enabled: false
  # Calendar days either side of a billed date to search for matching
  # correspondence (the "observed activity" proxy).
  window_days: 1
  # Entries billed below this many hours are too small to usefully flag.
  hours_min_to_flag: 0.5
  # Flag an entry whose hours, relative to the words of matching
  # correspondence found, exceed this ratio.
  hours_per_100_words_threshold: 1.5
  # Contracted hourly rate per timekeeper, read off the engagement letter.
  # Any invoiced rate above this is flagged regardless of hours -- this is
  # a deterministic contract check, not a heuristic.
  rate_caps: {}
  #   "Henry Newton-Savage": 500.0
